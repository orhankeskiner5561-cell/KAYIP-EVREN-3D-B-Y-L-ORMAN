name: Blender GLB Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Generate forest scene
        run: blender -b --python blender/generate_forest.py
      - name: Verify outputs
        run: |
          test -s /tmp/kayip_evren_v6.blend
          test -s /tmp/kayip_evren_v6.glb
          ls -lh /tmp/kayip_evren_v6.*
      - uses: actions/upload-artifact@v4
        with:
          name: kayip-evren-v6-blender-glb
          path: |
            /tmp/kayip_evren_v6.blend
            /tmp/kayip_evren_v6.glb
