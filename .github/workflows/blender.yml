name: Blender GLB Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender -b --python-expr "import numpy; print('NUMPY_OK', numpy.__version__)"
      - name: Generate forest scene
        run: |
          mkdir -p output
          set -o pipefail
          blender -b --python blender/generate_forest.py 2>&1 | tee blender.log
          test -f output/kayip_evren_v6.glb || cp /tmp/kayip_evren_v6.glb output/ 2>/dev/null || true
          test -f output/kayip_evren_v6.blend || cp /tmp/kayip_evren_v6.blend output/ 2>/dev/null || true
      - name: Inspect outputs
        if: always()
        run: |
          ls -lah /tmp/kayip_evren* output/ || true
          tail -n 100 blender.log || true
      - name: Verify outputs
        run: |
          test -s output/kayip_evren_v6.blend
          test -s output/kayip_evren_v6.glb
      - name: Upload diagnostics and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kayip-evren-v6-results
          path: |
            output/
            blender.log
          if-no-files-found: warn
