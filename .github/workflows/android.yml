name: Android Forest APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'export_presets.cfg'
      - '.github/workflows/android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Godot and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          ls -l "$ANDROID_SDK_ROOT/build-tools/35.0.0" "$JAVA_HOME"
      - name: Generate test-only Android signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=KAYIP EVREN,C=TR"
          test -s "$HOME/.android/debug.keystore"
          sed -i "s|\\$HOME/.android/debug.keystore|$HOME/.android/debug.keystore|g" export_presets.cfg
          grep "keystore/debug=" export_presets.cfg
      - name: Inspect Godot Android export configuration
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          ls -lah "$HOME/.config/godot/" || true
          cat "$HOME/.config/godot/editor_settings-4.tres" || true
          ls -lah "$HOME/.android/" || true
          ls -lah "$HOME/.local/share/godot/export_templates/4.3.stable/" | head -20
          cat export_presets.cfg
      - name: Diagnose Godot export settings
        run: |
          echo "Checking debug keystore and SDK..."
          grep 'keystore/debug=' export_presets.cfg
          test -s "$HOME/.android/debug.keystore"
          test -d "$ANDROID_SDK_ROOT/platform-tools"
          echo "Godot editor settings after project initialization:"
          find "$HOME/.config/godot" -maxdepth 2 -type f -print
          grep -R 'export/android/' "$HOME/.config/godot" || true
      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --editor --path . --export-debug Android build/kayip-evren-orman-test.apk 2>&1 | tee build/export.log
          test -s build/kayip-evren-orman-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kayip-evren-android-test
          path: |
            build/*.apk
            build/export.log
